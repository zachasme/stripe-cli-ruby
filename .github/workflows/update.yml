name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Bump to the latest Stripe CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo stripe/stripe-cli --json tagName --jq .tagName)
          latest=${latest#v}
          if [[ ! $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Stripe CLI version: $latest"
            exit 1
          fi

          current=$(sed -nE 's/.*VERSION = "(.*)"/\1/p' lib/stripe_cli/upstream.rb)
          if [[ $(printf '%s\n' "$current" "$latest" | sort -V | tail -1) == "$current" ]]; then
            echo "Already on Stripe CLI $current"
            exit 0
          fi

          sed -i -E "s/VERSION = \".*\"/VERSION = \"$latest\"/" lib/stripe_cli/upstream.rb lib/stripe_cli/version.rb
          sed -i -E "s/stripe-cli-ruby \(.*\)/stripe-cli-ruby ($latest)/" Gemfile.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to Stripe CLI $latest"
          git push

          # Pushes made with the workflow token don't trigger workflows, so start ci by hand.
          # ci tests, builds and publishes the new version.
          gh workflow run ci.yml --ref main
