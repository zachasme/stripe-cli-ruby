name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4", "4.0", "head" ]
    steps:
      - uses: actions/checkout@v5
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake download
      - run: bundle exec rake test
        env:
          TEST_STRIPE_API_KEY: ${{ secrets.TEST_STRIPE_API_KEY }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rubocop

  package:
    name: package (${{ matrix.platform }})
    needs: [ test, lint ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ ruby, arm64-darwin, aarch64-linux, x86_64-darwin, x86_64-linux ]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake gem:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem

  install:
    name: install (${{ matrix.platform }})
    needs: package
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ruby, runs-on: ubuntu-latest }
          - { platform: arm64-darwin, runs-on: macos-latest }
          - { platform: aarch64-linux, runs-on: ubuntu-24.04-arm }
          - { platform: x86_64-darwin, runs-on: macos-15-intel }
          - { platform: x86_64-linux, runs-on: ubuntu-latest }
          - { platform: x86_64-linux, runs-on: ubuntu-latest, image: "ruby:alpine" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg
      - if: "!matrix.image"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - if: "!matrix.image"
        run: gem install pkg/*.gem
      - if: matrix.platform == 'ruby'
        run: stripe 2>&1 | grep -F 'Cannot find the stripe cli executable'
      - if: matrix.platform != 'ruby' && !matrix.image
        run: stripe --version
      - if: matrix.image
        run: docker run --rm -v "$PWD/pkg:/pkg" ${{ matrix.image }} sh -c "gem install /pkg/*.gem && stripe --version"

  # Publishes when lib/stripe_cli/version.rb names a version that isn't tagged yet.
  release:
    needs: install
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(ruby -r ./lib/stripe_cli/version -e 'print StripeCLI::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Already released v$version"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new
        uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg
      - if: steps.version.outputs.new
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - if: steps.version.outputs.new
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - if: steps.version.outputs.new
        run: for gem in pkg/*.gem; do gem push "$gem"; done
      - if: steps.version.outputs.new
        run: gh release create "v$VERSION" pkg/*.gem --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
